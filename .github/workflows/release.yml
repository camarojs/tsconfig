name: Release CI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance --access public
